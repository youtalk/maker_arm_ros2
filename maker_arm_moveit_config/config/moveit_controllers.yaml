moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - link_002_joint
      - link_003_joint
      - link_004_joint
      - link_005_joint
      - link_006_joint
      - link_007_joint
  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - gripper_left_joint
    # INITIAL: V2 measured a 5.62 s close against a 5.9 s allowance
    allowed_execution_duration_scaling: 1.5
