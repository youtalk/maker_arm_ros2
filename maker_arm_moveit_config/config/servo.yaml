# Flat parameters of moveit_servo 2.12 (Jazzy), read from
# /opt/ros/jazzy/share/moveit_servo/config/servo_parameters.yaml. That version has no
# planning_frame, ee_frame or robot_link_command_frame parameter: Servo takes the planning
# frame (mount_link) and the end-effector frame (grasp_center) from the "arm" chain in the SRDF.
move_group_name: arm
incoming_command_timeout: 0.5
command_in_type: speed_units
# The Butterworth filter scaled the commanded speed by 0.571: V2 measured 28.6 of 50 mm/s.
# Without the filter, these bound one step: Servo scales to the planning velocity limits, the
# daemon refuses an arm target more than 0.05 rad from the last one and holds, Tracking's
# e_max clamps the position error (and so the spring torque), and the command clamp caps every
# motor command. Check this on the real arm in V3.
use_smoothing: false
check_collisions: true
# Servo slows down above lower_singularity_threshold and halts at hard_stop_singularity_threshold.
# Both are above the moveit_servo 2.12 defaults (17 and 30). Servo's condition number mixes
# metres and radians, so it reads high on this small arm: above 17 in 99% and above 30 in 75% of
# random poses above the desk. At the defaults, Servo already slowed at work (25.4) and stand
# (22.4), and in the simulation a 4 s push at 0.05 m/s along x, y or z moved the tip only 16 to
# 141 mm. At 25 and 40 the same pushes move it 38 to 195 mm, and Servo still halts at home (41.0).
# test_srdf.py checks work and stand below the hard stop and home above it.
hard_stop_singularity_threshold: 40.0
lower_singularity_threshold: 25.0
# double_array: either one value for all joints or one per joint of the "arm" group (6 joints,
# link_002..link_007), in radians. Servo halts 0.05 rad inside the limits of joint_limits.yaml.
# Those are 0.05 rad inside the profiles, and the profiles are 0.05 rad inside the vendor's stop
# captures: Servo halts 0.15 rad before a stop. test_srdf.py reads these margins.
joint_limit_margins: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
command_out_type: trajectory_msgs/JointTrajectory
command_out_topic: /arm_controller/joint_trajectory
joint_topic: /joint_states
publish_period: 0.01
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
