name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
      # tini as PID 1 reaps the test daemons, which the plugin's double fork gives to PID 1.
      options: --init
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/maker_arm_ros2
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      # From a clone: apt's cargo-1.85 cannot fetch a git URL (its system libgit2 is too old).
      - name: Install the daemon
        run: |
          apt-get install -y git rustc-1.85 cargo-1.85
          src=$(mktemp -d)
          git clone https://github.com/youtalk/maker-arm-rs "$src/maker-arm-rs"
          git -C "$src/maker-arm-rs" checkout be17836308af8602fee5d319eb1565f30445636d
          PATH=/usr/lib/rust-1.85/bin:$PATH cargo install --locked --path "$src/maker-arm-rs/crates/maker-arm-cli"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: . /opt/ros/jazzy/setup.sh && colcon build
      - name: Test
        run: . /opt/ros/jazzy/setup.sh && colcon test && colcon test-result --verbose
