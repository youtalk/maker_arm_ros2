name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/maker-arm-ros2
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: . /opt/ros/jazzy/setup.sh && colcon build
      - name: Test
        run: . /opt/ros/jazzy/setup.sh && colcon test && colcon test-result --verbose
